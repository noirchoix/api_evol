openapi: 3.1.0
info: {title: Customer API, version: "1.0"}
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: {type: string}
                  email: {type: string}
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku]
              properties:
                sku: {type: string}
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
